# Calamares session config for Obsidian OS.
# Reference: Calamares `settings.conf` (YAML serialization of CalamaresSettings).
installMode: alongside
disable-cancel-during-exec: true
dont-chroot: false
showDebugOutput: false

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - mount
      - unpackfs
      - luksopenswaphook
      - partition
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - luksbootkeyfile
      - networkcfg
      - bootloader
      - sbctl
      - grubcfg
      - initcpiocfg
      - initramfs
      - fwupd

# Network install off for privacy-first default; enable for faster CDN mirrors.
netinstall: false