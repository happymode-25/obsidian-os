# Calamares session config for Obsidian OS (task 1.5).
# Shape and key names checked against the upstream top-level `settings.conf`
# and `src/calamares/Settings.cpp`. UNTESTED — see docs/INSTALLER.md.
#
# Three keys the 1.4 skeleton used are not settings.conf keys and were removed:
#   * `installMode: alongside` — not a key. Install mode is a *choice on the
#     partition page*, not a session setting.
#   * `showDebugOutput: false` — not a key.
#   * `netinstall: false` — not a key; `netinstall` is a module. A network
#     install is enabled by putting `- netinstall` in the exec phase, which is
#     left out below because Obsidian installs from local media by default.
# What remains (`disable-cancel-during-exec`, `dont-chroot`, `oem-setup`,
# `quit-at-end`, `prompt-install`, `hide-back-and-next-during-exec`,
# `modules-search`, `instances`, `sequence`, `branding`) is real.
---
modules-search: [ local ]

# A real distro ships its own branding component (branding.desc) and points
# here. `default` is upstream's sample branding and will NOT say Obsidian OS.
branding: default

# Confirm before the exec phase runs: that is the point of no return, where
# the disk gets repartitioned.
prompt-install: true
oem-setup: false
dont-chroot: false
# This is an installer, not a post-install configurator, so cancel is honest to
# offer before the exec phase and pointless afterwards.
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
# Stay on the final page so the user reads it. Setting this true would quit
# Calamares automatically at the end of the sequence.
quit-at-end: false

# The unencrypted partition layout, as a second instance of the same module.
# It is deliberately NOT in the sequence below: the encrypted layout is the
# default. To install unencrypted, change `- partition` to `- partition@plain`
# in the show phase. Wiring a runtime "which layout?" picker is the upstream
# packagechooser + packagechooserq pair, and is not done yet
# (docs/INSTALLER.md gap 5).
instances:
    - id: plain
      module: partition
      config: partition-plain.conf

# show: what the user clicks through. exec: what runs, in order.
#
# The requested flow is welcome -> partition -> users -> bootloader -> summary
# -> finished. `bootloader` appears in the exec phase, not the show phase, and
# that is not a deviation from the plan so much as how Calamares works: the
# bootloader module is a job module (it ships main.py and a config, no view
# step), and upstream is explicit that "a jobmodule instance key can only
# appear in an exec phase". It has no page to show. The user-visible order is
# therefore welcome -> partition -> users -> summary -> finished, and the
# bootloader is installed after the user confirms, as part of the same exec
# phase that writes crypttab, the initramfs and /etc/default/grub.
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      # Order matters from here down.
      - partition        # repartition + create the LUKS2 containers
      - mount            # mount the target (its own mount.conf, with
                         # extraMounts, is not in this tree yet)
      - unpackfs         # copy the live system into the target
      - machineid
      - locale
      - keyboard
      - localecfg
      # Creates a keyfile for the LUKS containers so they open without the
      # passphrase. Deliberately OFF: a readable key file is a weaker guarantee
      # than a passphrase, and the protection Obsidian actually wants is TPM2
      # sealing (scripts/boot-keys.sh tpm), which is not wired yet. If it is
      # ever enabled it MUST sit before initramfs, or the key file is not in
      # the image. See modules/luksbootkeyfile.conf.
      #- luksbootkeyfile
      - fstab            # /etc/fstab AND /etc/crypttab in the target
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      # Rebuilds the initramfs. It has to carry the cryptroot hook and the
      # target's crypttab for the LUKS root to open (see fstab above); it also
      # carries the key file if luksbootkeyfile is ever enabled, which is why
      # that module would have to run before this one.
      - initramfs
      # Writes /etc/default/grub, including GRUB_ENABLE_CRYPTODISK when the
      # target has LUKS filesystems. MUST be before bootloader.
      - grubcfg
      # Installs the EFI bootloader and the LUKS-aware kernel command line.
      - bootloader
      - umount
  - show:
      - finished

# Not in the sequence, and the reasons are deliberate:
#
#   netinstall      — network install is off by default (privacy). Add
#                     `- netinstall` to exec to enable it.
#   luksopenswaphookcfg / dracutlukscfg — real upstream modules, both
#                     irrelevant as written: the first configures the openswap
#                     hook for an *encrypted swap partition* and this image has
#                     none (userSwapChoices: none, zram at runtime), the second
#                     is only needed if the target uses dracut.
#   openrcdmcryptcfg — OpenRC equivalent of the above; Obsidian is systemd.
#   pml / services-openrc / zfshostid / zfs — wrong init system or fs.
#   shellprocess    — the one that is actually MISSING and wanted: the
#                     post-install step that runs `scripts/boot-keys.sh enroll`,
#                     `sign` and `tpm` (sbctl keys, UKI signing,
#                     `systemd-cryptenroll --tpm2-device=auto` on the root
#                     container) and then `scripts/finalize.sh obsidian`.
#                     shellprocess is a real upstream module and takes a
#                     script + argument list per instance; its config keys were
#                     not verified here, so the instance is not written rather
#                     than guessed. This is docs/INSTALLER.md gap 3.
