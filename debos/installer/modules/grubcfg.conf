# Calamares grubcfg module — Obsidian OS.
#
# This module is what actually turns on GRUB's LUKS support. Per its own
# documentation it writes /etc/default/grub in the target from calculated
# values, and the calculated values include
#   GRUB_ENABLE_CRYPTODISK, based on the presence of filesystems that use LUKS
# and a GRUB_CMDLINE_LINUX_DEFAULT that gains the LUKS setup. So cryptodisk is
# not a bootloader-module option and must not be configured in bootloader.conf:
# it is on because the target has LUKS filesystems, and the only requirement
# is that this module runs BEFORE bootloader in the exec phase.
#
# Real keys: overwrite, prefer_grub_d, keep_distributor, kernel_params,
# defaults, always_use_defaults. UNTESTED — see docs/INSTALLER.md.
---
# Edit the image's existing /etc/default/grub instead of replacing it, so
# anything the base image already sets survives. Nothing in the tree currently
# writes a /etc/default/grub, so the image's grub package default is what
# starts from here; `always_use_defaults: false` means the `defaults` map below
# is only applied if the file has to be created.
overwrite: false
always_use_defaults: false

# One file rather than a fragment directory. Obsidian's own kernel cmdline
# handling lives in /etc/obsidian/kernel-cmdline and is applied on first boot,
# so a 00calamares.cfg fragment would only add a second place to look.
prefer_grub_d: false
keep_distributor: false

# Baseline flags, matching kernelParams in bootloader.conf. GRUB's cryptodisk
# prompt is not in here: cryptodisk brings its own.
kernel_params: [ "quiet", "loglevel=3", "oops=panic", "panic_on_warn=1" ]

# Used only when /etc/default/grub is created from scratch. GRUB_ENABLE_CRYPTODISK
# is deliberately absent: the module computes it from the LUKS filesystems it
# finds, and writing it by hand would be overwritten anyway.
defaults:
    GRUB_TIMEOUT: 2
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
