# Calamares users module — Obsidian OS (task 1.5).
#
# The installer-created account. It is deliberately consistent with
# scripts/firstboot-wizard so that installing and then first-booting produces
# one coherent account, not two:
#
#   scripts/firstboot-wizard, step 2:
#     USER_NAME="$(answer 'Full name' 'Obsidian User')"
#     USER_LOGIN="$(answer 'Username' obsidian)"
#
#   the wizard also runs /etc/obsidian/scripts/finalize.sh obsidian, whose user
#   line is `useradd -m -G sudo,libvirt,storage,realtime -s /bin/bash obsidian`.
#   The group list below mirrors that, minus `realtime`: no Debian trixie
#   package creates that group, and a `must_exist: true` entry that is absent
#   ABORTS the install. If Obsidian wants `realtime`, it has to start shipping
#   a package that creates it.
#
# Every key below was checked against src/modules/users/Config.cpp and the
# shipped users.conf. UNTESTED — see docs/INSTALLER.md.
---
# --- Groups -----------------------------------------------------------------
# Real key: `defaultGroups` (a list). The 1.4 skeleton's `userGroup: sudo` is
# not a key of this module.
#   * a plain string  -> non-system group; created if it does not exist
#   * a map with name/must_exist/system -> error out if must_exist and missing
# must_exist is kept to the three groups Debian definitely has, because a miss
# is a hard install failure rather than a warning.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: adm
      must_exist: true
      system: true
    - name: sudo
      must_exist: true
      system: true
    - video
    - audio
    - plugdev
    - netdev
    - cdrom
    - dialout
    - kvm
    - libvirt
    - storage
    - lp

# Writes /etc/sudoers.d/10-installer for the created user. `sudo` is in
# defaultGroups above, as upstream requires. Deliberately left at upstream's
# default behaviour: the alternative (sudoersConfigureWithGroup) changes the
# written rule to ALL=(ALL:ALL), and that branch's exact text was not verified
# here, so it is not set.
sudoersGroup: sudo

# Autologin: not offered, not checked. A hardened single-admin image that
# silently logs itself in defeats the disk encryption it just created, and the
# firstboot wizard has no autologin question to stay consistent with.
# `autologinGroup` is intentionally unset for the same reason — Debian has no
# `autologin` group, and setting it would make the module look for one.
displayAutologin: false
doAutologin: false

# --- Root -------------------------------------------------------------------
# No root password: the image has a single sudoer. Upstream notes that
# *doReusePassword* requires *setRootPassword*; the 1.4 skeleton set
# doReusePassword: true alongside setRootPassword: false, which is that
# contradiction. Both are now false.
setRootPassword: false
doReusePassword: false

# --- Passwords --------------------------------------------------------------
# Real keys: minLength, maxLength, and libpwquality (a list of pwquality.conf
# statements handed to the libpwquality parser; a password scoring below 40
# with these settings is rejected).
# The skeleton's `nonRepeatingChars: 3` is not a key of this module — only
# minLength, maxLength and libpwquality are read — so the intent moved into
# libpwquality as maxrepeat=3, the pwquality equivalent.
passwordRequirements:
    minLength: 10
    maxLength: 128
    libpwquality:
        - minlen=10
        - minclass=3
        - maxrepeat=3
        - maxsequence=3
        - usersubstr=4

# Weak passwords cannot be allowed, and the escape hatch that offers them is
# not shown. Both real keys.
allowWeakPasswords: false
allowWeakPasswordsDefault: false

# --- User settings ----------------------------------------------------------
# Real key `user`, sub-keys shell / forbidden_names / home_permissions.
# home_permissions is given as an octal triple; upstream's own example spells
# it "o750". 0700 is chosen deliberately for a single-user encrypted image.
user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"

# --- Hostname ---------------------------------------------------------------
# Real key `hostname`, but it is a MAP with sub-keys location / writeHostsFile —
# the 1.4 skeleton's scalar `hostname: obsidian-os` is the wrong shape.
# `location: EtcFile` writes /etc/hostname in the target.
#
# CONFLICT, on purpose and unresolved: scripts/finalize.sh does
# `hostnamectl set-hostname "$HF-$(od -An -N2 -tx /dev/urandom | tr -d ' ' | head -c4)"`
# (that is where the skeleton's "re-randomizes the tail" note came from). If
# finalize.sh runs after the users module — and in the current exec order it
# does — the randomized hostname wins and the value written here is discarded.
# Obsidian wants the random hostname (ARCHITECTURE.md §6, per-boot MAC and
# hostname rotation), so EtcFile is kept as the fallback and the conflict is
# recorded in docs/INSTALLER.md rather than papered over.
hostname:
  location: EtcFile
  writeHostsFile: true

# --- Defaults shown in the wizard -------------------------------------------
# Real sub-keys of the `defaults` map: loginName and fullName. These are the
# pre-filled values in the user page, and they are byte-identical to the
# firstboot-wizard's own defaults so the two steps agree.
defaults:
  loginName: obsidian
  fullName: Obsidian User
