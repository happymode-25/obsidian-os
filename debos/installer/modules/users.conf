# Calamares users module — Obsidian OS.
# Single admin account created; password feeds firstboot LUKS2 re-key.
---
userGroup: sudo
doAutologin: false
doReusePassword: true
sudoersGroup: sudo
avatarFilePath: ""

# Password policy enforced by pwquality on the installed system anyway.
passwordRequirements:
  minLength: 10
  maxLength: 128
  nonRepeatingChars: 3

defaults:
  fullName: Obsidian User
  loginName: obsidian

# Preset hosts: finalize.sh re-randomizes the tail at install.
hostname: obsidian-os
setRootPassword: false