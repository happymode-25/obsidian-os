# Calamares luksbootkeyfile module — Obsidian OS.
#
# Real key in this module: `luks2Hash` — "Set Password-Based Key Derivation
# Function (PBKDF) algorithm for LUKS keyslot", with the usable values
# pbkdf2, argon2i, argon2id and `default`. There is no other key in the module.
#
# WHAT THIS MODULE DOES, AND WHY IT IS NOT IN THE DEFAULT SEQUENCE
# It creates a *key file* for the LUKS encrypted devices, so the encrypted
# volumes open at boot without anyone typing the LUKS passphrase. On a hardened
# distribution that is a downgrade unless the key file is itself protected, and
# the protection Obsidian actually wants is TPM2 sealing
# (`systemd-cryptenroll --tpm2-device=auto`, which is what
# `scripts/boot-keys.sh tpm` does) — not a readable key file in an initramfs.
#
# So: settings.conf ships this module COMMENTED OUT of the exec phase, and
# the passphrase is the only keyslot. Uncommenting it is a one-line change,
# and the KDF below then applies to the *key file's* keyslot.
#
# Note the scope of `luks2Hash`: it configures the key slot this module adds.
# It does NOT configure the key slot created from the user's passphrase during
# partitioning — that container is LUKS2 (see partition.conf: luksGeneration),
# so its passphrase slot gets cryptsetup's LUKS2 default PBKDF, argon2id.
# That is where Obsidian's Argon2id actually comes from.
#
# If this module is enabled, it must run BEFORE initramfs in the exec phase, or
# the key file is not in the image it builds.
#
# UNTESTED — see docs/INSTALLER.md.
---
luks2Hash: argon2id
