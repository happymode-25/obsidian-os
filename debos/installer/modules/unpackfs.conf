# Calamares unpackfs module — Obsidian OS.
#
# The module is a Python job module (src/modules/unpackfs/main.py). Its
# configuration is a list under the `unpack` key; the older
# `source: livefs` / `rootfs:` spelling is no longer what it reads, and there is
# no shipped sample config, so the keys below were read out of main.py itself:
# per entry `source`, `sourcefs`, `destination`, plus optional `condition`,
# `exclude`, `excludeFile`, `optional`.
#
# UNTESTED — see docs/INSTALLER.md.
---
# The live medium is mounted by live-boot (build/flavors/common.pkgs pins
# `live-boot`; build/build-iso.sh writes the image as `live/filesystem.squashfs`
# inside the ISO). live-boot's medium mount point is /run/live/medium, so the
# squashfs is the file below, and it is unpacked with `unsquashfs` — which the
# live session has, since squashfs-tools is in the same package list.
#
# Unpacking the *image* rather than the live root is deliberate: it avoids
# copying live-boot's own tmpfs overlay and its mounts of /dev, /proc, /sys
# and /run into the installed system. The squashfs carries empty
# pseudo-directories for those anyway — build-iso.sh explicitly does NOT
# exclude dev/proc/sys/run/tmp from the image — so the target gets the
# directories without their contents.
#
# If the live session is ever started with a different medium mount point, this
# path is the first thing that has to change.
unpack:
    - source: /run/live/medium/live/filesystem.squashfs
      sourcefs: squashfs
      destination: ""
