# Calamares fstab module — Obsidian OS.
#
# The module creates /etc/fstab AND /etc/crypttab in the target, and creates
# the mount points. fstab entries reuse the options the mount module already
# worked out, so the install options come from the partition layout and
# /etc/fstab needs no hand-written entries here.
#
# Real keys: crypttabOptions, tmpOptions. UNTESTED — see docs/INSTALLER.md.
---
# Options for each /etc/crypttab line. Upstream names the Debian case
# explicitly: "For Debian and Debian-based distributions, change the above line
# to: crypttabOptions: luks,keyscript=/bin/cat". This is the line that makes
# initramfs-tools' cryptroot hook able to open the three Obsidian containers
# (/, /home, /var/lib/libvirt) before the real root is up, which is the
# mechanism the LUKS-root boot in docs/INSTALLER.md gap 1 depends on.
crypttabOptions: luks,keyscript=/bin/cat

# /tmp handling. `ssd` makes /tmp a tmpfs, which is both faster and the right
# default for a machine with encrypted zram and no disk swap. The options
# string here is also the one place in the whole install path where a per-mount
# option such as noatime is genuinely expressible — the partition module has no
# per-mount options field at all (see the note at the end of partition.conf).
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
