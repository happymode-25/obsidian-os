# Calamares partition module — Obsidian OS, UNENCRYPTED variant.
#
# Second instance of the `partition` module, declared in ../../settings.conf as
# instance id `plain` (instance key `partition@plain`, config
# `partition-plain.conf`). It exists so the plain path stays draw-able and
# reviewable next to the encrypted one, and so a reviewer can compare a
# LUKS2 install against a plain install on the same machine.
#
# It is NOT in the default sequence. Switching to it is a one-line change in
# settings.conf (`- partition` -> `- partition@plain` in the show phase), or
# the upstream "pick a variant at runtime" mechanism
# (`packagechooser` + `packagechooserq`, both real upstream modules) — that
# switcher is not wired yet; see docs/INSTALLER.md.
#
# Only three things differ from partition.conf: `preCheckEncryption` is off,
# every layout entry says `noEncrypt: true`, and the layout warning text is
# gone. Everything else is identical on purpose, so a diff between the two
# files is exactly the encryption delta.
#
# UNTESTED. See docs/INSTALLER.md.
---
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    minimumSize:     300MiB
    label:           "OBSIDIAN"

defaultPartitionTableType: gpt
requiredPartitionTableType: gpt
initialPartitioningChoice: none
essentialMounts: [ "live-*", "control", "ventoy" ]
requiredStorage: 8

lvm:
    enable: false

allowManualPartitioning: true

userSwapChoices:
    - none
initialSwapChoice: none

# Encryption is AVAILABLE (the user can still tick it) but not pre-checked,
# and the container format stays luks2 so that a user who does tick it gets
# the same LUKS2 containers as the default path rather than a surprise LUKS1.
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
luksGeneration: luks2
luksFileSystemType: ext4

# Same three Obsidian containers, same sizes, all exempt from encryption.
# `noEncrypt` is a documented partitionLayout attribute: "whether this
# partition is exempt from encryption if enabled (optional parameter; default
# is false)".
partitionLayout:
    - name: "root"
      filesystem: "ext4"
      mountPoint: "/"
      size: "25%"
      minSize: 8G
      noEncrypt: true
    - name: "home"
      filesystem: "ext4"
      mountPoint: "/home"
      size: "30%"
      minSize: 8G
      noEncrypt: true
    - name: "vmdata"
      filesystem: "ext4"
      mountPoint: "/var/lib/libvirt"
      size: "45%"
      minSize: 4G
      noEncrypt: true
