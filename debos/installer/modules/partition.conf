# Calamares partition module — Obsidian OS guided install (task 1.5).
# Goal: UEFI GPT layout with fully encrypted data partitions (LUKS2).
#
# Every key name below was checked against the upstream Calamares sources for
# the `partition` module: `src/modules/partition/Config.cpp`, `Config.h`,
# `PartitionViewStep.cpp`, and the shipped `partition.conf`. Keys that are NOT
# part of that module are called out inline rather than invented. Nothing in
# this file has been executed yet — see docs/INSTALLER.md.
#
# Changes vs. the 1.4 skeleton, each because the old spelling is not a key of
# this module (or is a type error):
#
#   * `efiSystemPartition: true` / `efiSystemPartitionSize` / `efiSystemPartitionName`
#     are documented DEPRECATED ALIASES, and `efiSystemPartition` there is the
#     ESP *mount point string*, not a boolean. The nested `efi:` map is the
#     supported spelling, so the skeleton's `true` was a type error.
#   * `swap: { numSwapDevices: 0, ensureSuspendToDisk: false }` ->
#     `userSwapChoices`. `numSwapDevices` is not a key of this module;
#     `ensureSuspendToDisk` is a LEGACY setting (still read, logs a warning).
#   * `luks: { luksPassphrase, generateStrongPassphrase, luksSwap,
#     encryptedPartitions, extraMountOptions }` — this module has no `luks`
#     map at all. The supported knobs are `enableLuksAutomatedPartitioning` +
#     `preCheckEncryption` (UI) and `luksGeneration` (container format).
#   * `disablePartitionIds` is not a key of this module. Dropped.
#   * `mountOptions:` (a top-level list of mountPoint/options) is not a key of
#     this module. The per-mount `noatime` / `nodev` intent is recorded as an
#     open gap below instead of as a config line.
#   * There is no `luksName` key. The LUKS mapper name is generated by the
#     module and published to global storage as `luksMapperName` (with
#     `luksUuid`); the bootloader module reads it. Nothing here can rename it.
#   * The layout dropped its `boot` fat32 entry: upstream "prepend[s] the EFI
#     system partition automatically to the layout if needed", so an explicit
#     entry duplicates it. Sizes also moved from `type:` to `size:` — `type:`
#     takes a GPT type GUID, and the skeleton had put "512M"/"40G" in it.
---
# EFI system partition. `M` means MiB, `MB` would mean 10^6 bytes.
# Upstream defaults: mountPoint "/boot/efi", recommendedSize 300MiB,
# minimumSize 32MiB (the EFI spec floor), label unset. We take 512 MiB
# because this ESP also has to hold Secure Boot variables' loader copies,
# the systemd-boot EFI binary, and the UKIs signed by sbctl.
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    minimumSize:     300MiB
    label:           "OBSIDIAN"

# Firmware and disk handling. The install path is UEFI-only: a LUKS2 root with
# systemd-boot/GRUB is not the target, so do not offer a BIOS/legacy path that
# cannot be validated.
defaultPartitionTableType: gpt
# Restrict the install to GPT disks, so Calamares refuses msdos tables.
# (Real key; values are case-sensitive.)
requiredPartitionTableType: gpt
# None: force the user to actually pick a destructive action. Upstream's
# recommendation for a single-disk installer is to make them choose rather
# than let a stray click erase a disk.
initialPartitioningChoice: none
# The live session's own media must be clearable before repartitioning;
# `live-*` is upstream's pattern, `control` and `ventoy` are upstream's own
# hard-coded exceptions (listed here too, harmlessly).
essentialMounts: [ "live-*", "control", "ventoy" ]
# Gate for the "replace"/"resize" choices, in GiB. Without any value at all
# those options are not offered. Keep it low: the sizes that actually matter
# are enforced by the layout's minSize values below.
requiredStorage: 8

# LVM: off. The three Obsidian containers are separate LUKS partitions, not
# volume groups, and the ESP + containers have to be individually selectable
# in manual partitioning.
lvm:
    enable: false

# Manual partitioning stays available (it is how a reviewer validates a real
# layout on real hardware), but Erase is the supported path.
allowManualPartitioning: true

# Swap: none on disk. Obsidian uses encrypted zram at runtime (see
# docs/ARCHITECTURE.md §2), and the partition module's `file` option needs the
# fstab module to create the file. `- none` is upstream's own first choice.
# LEGACY `ensureSuspendToDisk` / `neverCreateSwap` are not used: they generate
# a deprecation warning in the module log.
userSwapChoices:
    - none
initialSwapChoice: none

# --- Encryption -------------------------------------------------------------
# LUKS in the automated ("erase") path, with the encryption box pre-checked:
# shipping an installer that silently produces an unencrypted root is exactly
# the failure this module is here to prevent. Upstream warns loudly that
# disabling LUKS in automated mode is unsupported use of the software.
enableLuksAutomatedPartitioning: true
preCheckEncryption: true
# Keep the "Boot partition not encrypted" warning. The ESP is necessarily
# unencrypted, and the user should be told so by the installer rather than by
# a later audit.
showNotEncryptedBootMessage: true

# Container format. Upstream defaults to `luks1` with the comment that "grub
# doesn't support LUKS2 + Argon2id currently". Obsidian wants LUKS2 + Argon2id,
# which is safe ONLY because the root is unlocked by the initramfs, not by
# GRUB's own cryptodisk — see docs/INSTALLER.md and note the pairing rule:
#   * LUKS2 + Argon2id  => systemd-boot/UKI + an initramfs that handles it
#                          (dracut; Calamares ships `dracut` + `dracutlukscfg`)
#   * LUKS2 + PBKDF2    => also unlockable by stock GRUB cryptodisk
# The passphrase keyslot's KDF is whatever cryptsetup picks for LUKS2
# (argon2id by default); `luks2Hash` in luksbootkeyfile.conf only controls the
# *keyfile* keyslot.
luksGeneration: luks2
# Real key (read in Config.cpp/Config.h) but not described in the shipped
# partition.conf, so treat its exact meaning as unverified: the filesystem
# created *inside* the LUKS container.
luksFileSystemType: ext4

# --- Layout -----------------------------------------------------------------
# The three Obsidian containers (docs/ARCHITECTURE.md §2: `/`, `/home` and
# `/var/lib/libvirt` each in their own LUKS2 container). Real key: read by
# PartitionViewStep.cpp, documented in the shipped partition.conf.
#
# `size` accepts bytes with a K/M/G suffix, or a percentage of the drive; a
# final `100%` entry is how the shipped example ends, which reads as "all that
# is left". Percentages that sum to 100 are used here instead, because that
# interpretation of a trailing 100% is the one thing in this block I could not
# verify by reading the module. minSize keeps the layout drawable on a small
# disk.
#
# Encryption: partitions are encrypted unless `noEncrypt: true`. The default
# is false, so these three entries carry no `noEncrypt` and are LUKS2 when the
# user keeps encryption checked. The unencrypted variant of this same layout
# lives in partition-plain.conf (instance `partition@plain`) — see there for
# why it is a second file rather than a second key.
partitionLayout:
    - name: "root"
      filesystem: "ext4"
      mountPoint: "/"
      size: "25%"
      minSize: 8G
    - name: "home"
      filesystem: "ext4"
      mountPoint: "/home"
      size: "30%"
      minSize: 8G
    - name: "vmdata"
      filesystem: "ext4"
      mountPoint: "/var/lib/libvirt"
      size: "45%"
      minSize: 4G

# --- Known gap: per-mount options ------------------------------------------
# The 1.4 skeleton asked for `noatime` on `/` and `/home` and `nodev` on
# `/var/lib/libvirt` through a top-level `mountOptions:` list. That key does
# not exist in this module: it is absent from Config.cpp, from
# PartitionViewStep.cpp, and from the module's own documentation. The
# partitionLayout entry attributes are name, uuid, type, attributes,
# filesystem, noEncrypt, mountPoint, size, minSize, maxSize, features — there
# is no per-partition options field.
#
# The one real place options are expressed is `extraMounts` in mount.conf
# (device/fs/mountPoint/options/efi), and that is for *extra* mounts in the
# target, not for the installed root. So the hardened mount options are NOT
# configured here. Tracked in docs/INSTALLER.md as gap 4.
