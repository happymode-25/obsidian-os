# Calamares partition module — Obsidian OS guided install.
# Goal: UEFI GPT layout with fully encrypted data partitions (LUKS2/Argon2id).
# See modules docs: partition.conf reference at calamares docs site.
---
efiSystemPartitionName: "EFI System Partition"
efiSystemPartitionSize: "512M"
efiSystemPartition: true
disablePartitionIds: true

defaultFileSystemType: ext4
defaultPartitionTableType: gpt

# Swap = encrypted zram at runtime (no disk swap). Calamares swaps file off.
swap:
  numSwapDevices: 0
  ensureSuspendToDisk: false

# LUKS2 encryption for all user partitions (Argon2id set by cryptsetup default).
luks:
  luksPassphrase: true
  generateStrongPassphrase: false
  luksSwap: false
  encryptedPartitions: true
  extraMountOptions: [noatime]

allowManualPartitioning: true
ensureSuspendToDisk: false

# Mounts for the three Obsidian containers.
mountOptions:
  - mountPoint: /
    options: [defaults, noatime]
  - mountPoint: /home
    options: [defaults, noatime]
  - mountPoint: /var/lib/libvirt
    options: [defaults, noatime, nodev]

partitionLayout:
  - name: "boot"
    type: "512M"
    filesystem: fat32
    mountPoint: /boot
    efi: true
  - name: "root"
    type: "40G"
    filesystem: ext4
    mountPoint: /
    luks: true
  - name: "home"
    type: "50G"
    filesystem: ext4
    mountPoint: /home
    luks: true
  - name: "vmdata"
    type: "remaining"
    filesystem: ext4
    mountPoint: /var/lib/libvirt
    luks: true