# Calamares bootloader module — Obsidian OS (task 1.5).
#
# Installs the EFI bootloader and the kernel command line that unlocks the
# LUKS2 root. This is the last piece of the encrypted chain.
#
# THIS MODULE IS SCHEMA-CHECKED, AND THAT CHANGES THE FILE. The module ships
# `bootloader.schema.yaml` (src/modules/bootloader/bootloader.schema.yaml) with
# `additionalProperties: false`, so an unknown key is a configuration error,
# not a warning. The complete list of accepted keys is:
#
#   efiBootLoaderVar, efiBootLoader, kernelSearchPath, kernelName,
#   kernelParams, kernelPattern, loaderEntries, refindKernelList,
#   grubInstall, grubMkconfig, grubCfg, grubProbe, efiBootMgr,
#   efiBootloaderId, installEFIFallback, installHybridGRUB
#
# The 1.4 skeleton used four keys that are not in that list and would have been
# rejected: `efiBootLoaderId` (wrong capitalisation — it is `efiBootloaderId`,
# lowercase "l" in "loader"), `timeout`, a nested `kernel:` map, and
# `useBiosGrub`. `tpm:` is not here either: systemd-cryptenroll is not a
# bootloader-module concern at all, see the bottom of this file.
#
# Two of the names in the task description are not keys of this module, and
# saying so is more useful than writing them down and hoping:
#
#   * `installEFI` — not a key. The EFI install is implied: the module reads
#     the ESP path from global storage key `efiSystemPartition` (published by
#     the partition module from `efi.mountPoint`) and decides by firmware
#     type which of grub / sb-shim / refind / systemd-boot to install.
#   * `bootLoaderLocation` — not a key of this module, nor of the partition
#     module in this revision. There is no "pick the bootloader disk" widget.
#     The module finds the disk itself: it runs
#     `lsblk -o PKNAME "$(df --output=source <efiSystemPartition> | tail -n1)"`
#     and installs GRUB to that parent disk. So "bootLoader location on the
#     EFI partition" is satisfied structurally — the bootloader always lands
#     on the disk that holds the ESP — and needs no option.
#
# UNTESTED. Nothing below has been run against a real machine or a real disk.
# See docs/INSTALLER.md.
---
# Which bootloader to install for EFI systems. Real values in this module:
# grub, sb-shim, refind, systemd-boot, clr-boot-manager, none.
#
# GRUB is the default here because it is the path Calamares supports end to end
# with LUKS today (see the cryptodisk note below). The architecture's stated
# preference is systemd-boot + UKI; switch by changing this one value to
# "systemd-boot" and using the kernelSearchPath/kernelPattern/loaderEntries
# block further down. That switch is NOT validated — see docs/INSTALLER.md gap 1.
efiBootLoader: "grub"

# Let the partition/packagechooser modules override efiBootLoader from global
# storage. Unset on purpose: with no runtime bootloader switch there is no
# value to override it with.
#efiBootLoaderVar: "packagechooser_bootloader"

# EFI directory name, and the value passed to `grub-install --bootloader-id`.
# Upstream's warning, quoted: "Debian derivatives that use unmodified GRUB EFI
# packages should specifically set *efiBootloaderId* to "debian" because that
# is hard-coded in grubx64.efi". Obsidian OS is a trixie derivative, so
# "debian" is the value that works with the stock package. Branding the entry
# as "Obsidian OS" needs the ESP layout plus installEFIFallback below, and has
# not been checked; see docs/INSTALLER.md gap 2. The ESP's own FAT label is set
# by the partition module (`efi.label`), independently of this value.
efiBootloaderId: "debian"

# Also install bootx64.efi as the removable-media fallback loader. This is the
# cheapest insurance on a machine whose firmware has no NVRAM entry for the
# freshly installed bootloader, and it is the documented workaround for it.
installEFIFallback: true

# BIOS+UEFI dual install: off. The Obsidian install path is UEFI-only.
installHybridGRUB: false

# GRUB programs and paths. These are the real, supported keys — and this is the
# direct answer to "grubInstall for cryptodisk": grubInstall is only the path
# to the `grub-install` binary. There is no cryptodisk switch on it.
#
# GRUB_ENABLE_CRYPTODISK is not set here. It is set automatically by the
# `grubcfg` module (which must run BEFORE bootloader in the exec phase): per
# its own documentation it "writes /etc/default/grub in the target system
# based on calculated values", and "GRUB_ENABLE_CRYPTODISK, based on the
# presence of filesystems that use LUKS". So the encrypted path enables
# cryptodisk by existing, and the one thing to get right is ordering.
grubInstall:  "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg:      "/boot/grub/grub.cfg"   # Debian path; Fedora uses /boot/grub2
grubProbe:    "grub-probe"
efiBootMgr:   "efibootmgr"

# Kernel command line. Real key, and it is a LIST.
#
# This module appends to this list rather than replacing it. For a LUKS root it
# adds, per partition in global storage `partitions`:
#   * `rd.luks.uuid=<luksUuid>`          when dracut is present in the target,
#                                        or /etc/mkinitcpio.conf has systemd
#                                        in HOOKS
#   * `cryptdevice=UUID=<luksUuid>:<luksMapperName>`  in every other case
#   * `root=/dev/mapper/<luksMapperName>`
# and `root=UUID=<uuid>` when the root is NOT encrypted. An unencrypted swap
# gets `resume=UUID=<uuid>`; an encrypted swap gets `rd.luks.uuid=` plus
# `resume=/dev/mapper/<mapper>`.
#
# Read that branch carefully: on Debian trixie the target has neither dracut
# nor mkinitcpio, so the module takes the `cryptdevice=` branch. Whether
# Debian's initramfs-tools cryptroot hook acts on `cryptdevice=` is the single
# riskiest unvalidated assumption in this whole install path. That is gap 1
# in docs/INSTALLER.md, and it is why luksbootkeyfile.conf and the initramfs
# setup below are not optional.
#
# The flags below are the hardened baseline the live ISO already uses (see
# docs/ARCHITECTURE.md §2). Per-profile flags (lockdown=confidentiality for
# Ghost) are applied on first boot by the wizard, not written here.
kernelParams:
    - "quiet"
    - "loglevel=3"
    - "oops=panic"
    - "panic_on_warn=1"
    - "spectre_v2=on"
    - "slub_debug=FZ"
    - "lockdown=integrity"

# --- systemd-boot / UKI variant --------------------------------------------
# Used when efiBootLoader is "systemd-boot". Not active in the default path.
# kernelSearchPath + kernelPattern are how a kernel is found in the installed
# root; loaderEntries go into loader.conf, and "default" is added for you.
# UKI generation and signing are still not wired: scripts/boot-keys.sh does
# `sbctl sign` over /boot/EFI/Linux/*.efi and the systemd-bootx64.efi in
# /usr/lib/systemd/boot/efi, and that has to run as a post-install exec step
# (gap 3 in docs/INSTALLER.md), because no Calamares module does it.
#kernelSearchPath: "/usr/lib/modules"
#kernelPattern: "^vmlinuz.*"
#loaderEntries:
#  - "timeout 5"
#  - "console-mode keep"

# --- TPM2 auto-unlock -------------------------------------------------------
# Not configurable here: there is no TPM or cryptenroll key in the schema, and
# the 1.4 skeleton's `tpm: { enrollTpm2IfAvailable: true }` would be rejected.
# The real mechanism is `scripts/boot-keys.sh tpm`, which runs
# `systemd-cryptenroll --tpm2-device=auto <device>` on the root container, and
# it has to be invoked as a post-install exec step (gap 3).
