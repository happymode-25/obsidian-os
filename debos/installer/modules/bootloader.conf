# Calamares bootloader module — Obsidian OS.
# systemd-boot (UKI) + EFI variables + Secure Boot via sbctl (Phase 1.5).
---
bootloader: systemd-boot
efiBootLoaderId: "Obsidian OS"
timeout: 2

# Kernel args appended for every entry (hardened baseline, per-profile cmdline
# is added by finalize.sh / firstboot wizard from /etc/obsidian/kernel-cmdline).
kernel:
  line: "quiet loglevel=3 oops=panic panic_on_warn=1 spectre_v2=on slub_debug=FZ lockdown=integrity"

# TPM2 measured boot entries: generate both normal and measured UKIs.
tpm:
  # systemd-cryptenroll runs in the sbctl post-install module when enabled.
  enrollTpm2IfAvailable: true

# Omit on non-UEFI targets (BIOS fallback uses GRUB when present).
useBiosGrub: false