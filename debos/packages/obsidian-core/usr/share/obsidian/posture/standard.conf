# Obsidian OS — standard posture (daily-driver default)
# Source of truth; profiles/*.yaml select which posture file is linked into
# /etc/obsidian/posture.conf by apply-profile.sh.
#
# kernel cmdline additions:
quiet loglevel=3 oops=panic panic_on_warn=1 spectre_v2=on slub_debug=FZ lockdown=integrity

# sysctl namespace (merged with 99-obsidian-hardened.conf):
net.ipv4.conf.all.rp_filter = 1
net.ipv4.tcp_syncookies = 1
kernel.randomize_va_space = 2
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
fs.suid_dumpable = 0

# apparmor:
mode = complain

# swap: encrypted zram only
zram_size_percent = 50