# Obsidian OS — debos recipe (Debian trixie, rolling channel)
# Build:  debos -t flavor:daily obsidian.yaml
# Variants:  daily | penta | server | ghost | arch(secondary)
# Requires: debos >= 1.1.14 (debian-live action), host: Debian/Ubuntu or WSL2.
{{- $f := or .flavor "daily"}}
{{- $arch := or .arch "amd64"}}
{{- $release := or .release "trixie"}}
{{- $profile := ""}}
{{- if eq $f "penta"}}{{$profile = "pentester"}}{{else if eq $f "server"}}{{$profile = "server"}}{{else if eq $f "ghost"}}{{$profile = "privacy-max"}}{{else}}{{$profile = "daily-driver"}}{{end}}

architecture: {{ $arch }}

actions:
  - action: debootstrap
    suite: {{ $release }}
    components: [main, contrib, non-free-firmware]
    mirror: https://deb.debian.org/debian
    variant: minbase

  # ---- base system (kernel + boot chain) --------------------------------
  - action: apt
    packages:
      - linux-image-amd64          # hardened-flavored rebuild via obsidian-kernel pkg
      - linux-headers-amd64
      - systemd
      - systemd-boot
      - systemd-cryptsetup
      - tpm2-tools
      - cryptsetup
      - lvm2
      - efibootmgr
      - dbus
      - initramfs-tools
      - firmware-linux
      - apparmor
      - apparmor-profiles-extra
      - nftables
      - zram-tools
      - sudo
      - bash-completion
      - iproute2
      - openssh-client

  # ---- desktop: ObsidianWM session + panel (meta packages from repo) -----
  - action: apt
    packages:
      - obsidian-core            # metapackage: versions lock (obsidian repo)
      - obsidianwm               # wlroots compositor fork
      - obsidian-panel           # GTK4 layer-shell Start/taskbar/tray
      - obsidian-apps            # Files / Settings / Store / Security Center etc.
      - gtk4
      - libadwaita-1-0
      - gtk4-layer-shell
      - xwayland
      - slurp grim wl-clipboard swayidle bemenu
      - foot

  # ---- profile toolset ---------------------------------------------------
  - action: run
    script: ../scripts/apply-profile.sh
    args: {{ $profile }}

  # ---- security overlays ---------------------------------------------------
  - action: unpack
    file: overlays/common.tar
  - action: unpack
    file: overlays/{{ $profile }}.tar

  # ---- enable network + console on boot for the live session ---------------
  - action: run
    script: ../scripts/enable-services.sh
    args: "{{ $f }}"

  # ---- finalization: users, hostname, fstab/zram, firstboot ----------------
  - action: run
    script: ../scripts/finalize.sh
    args: "obsidian-{{ $f }}"

  # ---- pack: ISO -----------------------------------------------------------
  # debian-live composes a bootable ISO with the plugin set below.
  - action: debian-live
    snapshot: false
    release: {{ $release }}
    architecture: {{ $arch }}
    variant: standard
    packages:
      - linux-image-amd64
      - systemd-boot
      - systemd
      - cryptsetup
    plugins:
      - "live-boot"
      - "live-config"
      - "normal"
    themes:
      - none
    filename: "obsidian-{{ $f }}-{{ $release }}-{{ $arch }}.iso"

  - action: pack
    file: "obsidian-{{ $f }}-{{ $release }}-{{ $arch }}.iso"
    compression: none

# ------------------------------------------------------------------------------
# Notes
# ------------------------------------------------------------------------------
#  - The obsidian-* packages are built from ./debos/packages/*/debian/ by the
#    CI pipeline (see .github/workflows/build-iso.yml, step `build-packages`).
#  - The overlays/*.tar are produced by:  tar cf overlays/common.tar -C roots/common .
#  - Arch secondary recipe: debos/arch/obsidian-arch.yaml (same overlays,
#    arch-bootstrap instead of debootstrap).
#  - Ghost profile overlays/privacy-max.tar stages an amnesic dracut/live initrd;
#    kernel cmdline gets rd.live.overlay.overlayfs=1 etc.