# Obsidian OS — nftables firewall (default-deny inbound, egress policy by profile)
# Loaded at boot by obsidian-firewall.service; Security Center edits /etc/obsidian/fw.d/
# and runs: nft -f /etc/nftables.conf

flush ruleset

table inet obsidian {
    # egress chain: profiles set jump targets in /etc/obsidian/fw.d/egress.nft
    chain egress_leakguard {
        # DNS must go DoT/DoH (127.0.0.53/853 for systemd-resolved)
        ct original proto dns      drop
        ip daddr 127.0.0.53        accept
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # loopback permitted
        iif lo accept

        # established/related
        ct state established,related accept

        # ICMP friendly
        ip protocol icmp icmp type { echo-request, echo-reply, time-exceeded, destination-unreachable } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, destination-unreachable } accept

        # SSH + management only in Server profile (this file sourced from fw.d)
        # tcp dport 22 accept

        # drop everything else (logged to IDS flow)
        log prefix "OBS-FW-DROP " flags all counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # gateway role appends DNAT/forward rules from fw.d/router.nft
    }

    chain output {
        type filter hook output priority filter; policy accept;
        jump egress_leakguard
    }
}

# ---------- Ghost-kill switch table (activated by killswitch.service) ----------
table inet obsidian_kill {
    chain torbind {
        type filter hook output priority -1; policy accept;
        tcp dport { 53, 80, 443 } drop
        udp dport { 53, 123, 853 } drop
        # below the Tor socks/proxy port legal; above is also dropped
        ip daddr 127.0.0.1 accept
    }
}