# Obsidian OS — boot gate markers. THE single source of truth.
#
# Both boot-test runners consume this file:
#   tests/boottest.sh      (bash, used by CI and by a Linux build host)
#   tests/boottest-win.ps1 (PowerShell, used for a local test against the
#                           Windows-host QEMU, where no Linux qemu exists)
#
# It is a separate file rather than arrays inside boottest.sh because a second
# runner that re-typed these lists would drift, and the lists ARE the gate. A
# gate that differs between the machine you develop on and the machine that
# decides whether the code merges is not a gate.
#
# Format: one entry per line, "<kind><TAB or spaces><marker>". Everything after
# the first whitespace run is the marker, so markers may contain spaces.
# Blank lines and lines starting with # are ignored.
#
#   required  must appear, or the image is not ours
#   forbidden must NOT appear, or the image is stock Debian
#
# Why each required marker exists:
#   OBSIDIAN-OS-MARKER v1  only overlays/common/usr/local/sbin/obsidian-boot-report
#                          emits it, so it proves our rootfs booted rather than
#                          a stock Debian live ISO
#   OBSIDIAN-OS-READY      the report unit ran to completion rather than dying
#                          halfway and printing the marker
#   sysctl-overlay present  the overlay layer was actually applied; without this
#                          a build that skipped overlays still boots
#   apparmor               attestation of a security control. Matched loosely
#                          (no expected value) because the value depends on the
#                          flavor, and a value pinned here would make every
#                          flavor change a boot-test change
#   firstboot              the first-boot wizard path ran
#   flavor=                the flavor requested is the flavor that booted
#
# Why each forbidden marker exists: these are the fingerprints of the old
# debos `debian-live` bug, where the built chroot was discarded and a vanilla
# Debian live ISO was substituted. A build could "succeed" and ship Debian.

required	OBSIDIAN-OS-MARKER v1
required	OBSIDIAN-OS-READY
required	OBSIDIAN-CHECK sysctl-overlay: present
required	OBSIDIAN-CHECK apparmor:
required	OBSIDIAN-CHECK firstboot:

forbidden	Welcome to Debian
forbidden	Debian GNU/Linux
