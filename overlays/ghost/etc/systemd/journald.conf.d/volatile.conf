# Obsidian OS — Ghost: journald holds NOTHING on disk.
#
# Storage=volatile keeps the journal in a tmpfs-backed file under /run, which
# is discarded at shutdown. This is the single most important line for
# anti-forensic purposes: with the default Storage=auto, journald will happily
# write compressed logs to /var/log/journal and defeat the entire mode.
[Journal]
Storage=volatile
Compress=yes

# never persist, regardless of the above
ForwardToSyslog=no
ForwardToSocket=no
ForwardToConsole=no

# nothing to retain; do not bother compressing what we are about to discard
MaxRetentionSec=1h
MaxFileSec=1h
RuntimeMaxUse=64M
