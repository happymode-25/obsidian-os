# Obsidian OS — nftables firewall (default-deny inbound, egress leak guard)
#
# Loaded at boot by the distro's own `nftables.service` (package: nftables),
# which reads /etc/nftables.conf. The Security Center edits /etc/obsidian/fw.d/
# and reloads with:  nft -f /etc/nftables.conf
#
# Rule-order rules of the house (these were the two original bugs):
#   1. loopback is accepted FIRST, before any drop that could match it.
#   2. any explicit accept is written BEFORE the broad drop it would otherwise
#      be swallowed by. In an egress chain, a later accept can never rescue
#      traffic an earlier drop already killed.
#   3. a live session gets its address over DHCP, so DHCP client traffic must
#      be accepted or the booted ISO has no network at all.

flush ruleset

table inet obsidian {

    # ------------------------------------------------------------------ #
    # egress leak guard
    # Goal: plaintext DNS may not leave the host, so apps are forced onto
    # DoT/DoH via systemd-resolved. Loopback and the resolved stub must be
    # reachable or DNS is dead — hence accepted first.
    # ------------------------------------------------------------------ #
    chain egress_leakguard {
        oif lo accept

        # systemd-resolved stub listener (127.0.0.53) — plain DNS to it is
        # internal, not a leak.
        ip  daddr 127.0.0.53 udp dport 53 accept
        ip  daddr 127.0.0.53 tcp dport 53 accept
        # DoT to the resolver (853 is in the drop set below; allow ours)
        ip  daddr 127.0.0.53 tcp dport 853 accept

        # anything else that is plain DNS egress is a leak -> drop it
        ct original proto dns drop
    }

    # ------------------------------------------------------------------ #
    # inbound
    # ------------------------------------------------------------------ #
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # --- live session bootstrap: DHCPv4 + DHCPv6 client ---
        # Without these the ISO boots with no address and the leak guard's
        # DoH story is untestable. Host here is always the DHCP server.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # --- ICMP / ICMPv6 (path MTU + neighbour discovery) ---
        ip protocol icmp icmp type {
            echo-request, echo-reply, time-exceeded,
            destination-unreachable, parameter-problem
        } accept
        meta l4proto ipv6-icmp icmpv6 type {
            echo-request, echo-reply, destination-unreachable,
            packet-too-big, time-exceeded, nd-router-solicit,
            nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert
        } accept

        # --- service ports are added by /etc/obsidian/fw.d/<role>.nft ---
        #   Server role:  tcp dport 22 accept
        #   Gateway role: udp sport 67 udp dport 68 accept (already above)
        #   Tor role:     tcp dport { 9001, 9030, 9050, 9150 } accept
        # Ghost deliberately exposes nothing inbound.

        log prefix "OBS-FW-DROP " flags all counter drop
    }

    # ------------------------------------------------------------------ #
    # forward — only the gateway role populates this
    # ------------------------------------------------------------------ #
    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    # ------------------------------------------------------------------ #
    # outbound
    # ------------------------------------------------------------------ #
    chain output {
        type filter hook output priority filter; policy accept;
        jump egress_leakguard
    }
}

# ---------------------------------------------------------------------- #
# Ghost kill switch.
# Activated by killswitch.service when Tor is expected but not answering.
# Same ordering rule: the loopback accept must precede the port drops,
# otherwise the Tor client's own connection to 127.0.0.1:9050 dies first
# and the kill switch is guaranteed to fire even on a healthy system.
# ---------------------------------------------------------------------- #
table inet obsidian_kill {
    chain killmode {
        type filter hook output priority -1; policy accept;

        # Tor's SOCKS / control ports live on loopback — never drop those.
        oif lo accept

        # NTP: sdwdate is the sanctioned clock source in Ghost mode.
        ip daddr 127.0.0.1 udp dport 123 accept

        # Plain DNS + friends: block the non-Tor exit paths.
        tcp dport { 53, 80, 123 } drop
        udp dport { 53, 123 }  drop

        # Steer port 443 to the Tor TLS-only transport handled upstream.
        # Documented, not enforced here (needs a redirect to 9150, which
        # belongs in the tor SOCKS policy, not the firewall).
    }
}
