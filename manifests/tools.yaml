      as ordinary installable tools. That is the wrong shape. C2 frameworks are
      not "pentest tools a distro bundles" - their presence in an image IS the
      harm, and shipping one turns every ISO into something a defender must
      quarantine. See docs/LEGAL.md and docs/ADR-0002.
      Recommendation (NOT yet implemented): remove this category from the image
      entirely. For legitimate red-team work, a consent-gated source install into
      a disposable microVM whose only egress is the lab range.
