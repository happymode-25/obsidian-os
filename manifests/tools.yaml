  ai-agent:
    label: AI / Agent Tooling (tier 11.10)
    tools:
      - id: ollama
        name: Ollama
        repo: https://ollama.com/
        install: binary
        gui: native
        status: unverified
        build_graph: exclude
        verified: never
        note: >
          Local-first LLM runtime, and the backbone of the AI Assistant design.
          NOT in Debian, so it is not installable from the suite. URL not yet
          machine-verified. Must be verified before the AI Assistant is
          implemented - the whole "local-first, no cloud dependency" claim in
          docs/APPS.md rests on it.

      - id: pipx
        name: pipx
        pkg: pipx
        gui: shell
        status: verified
        build_graph: include
        note: >
          Isolated Python tool installs. This is the only supported install
          method for the `install: pip` entries above - pip into the system
          Python is exactly the packaging mistake that Debian policy exists to
          prevent.

