        status: verified
        build_graph: include

  server-stack:
    label: Server Stack (tier 11.7)
    source: debian-trixie
    policy: >
      NONE of these belong in a base image. Baking four internet-facing
      daemons (nginx, caddy, postgresql, redis) plus samba and NFS into the
      base and then disabling them ships a machine with a large, versioned,
      network-listening attack surface for no benefit. They are installed on
      first boot by the role toggle, never at build time.
    tools:
      - id: nginx
        name: nginx
        pkg: nginx
        gui: shell
        status: verified
        build_graph: exclude
        role: server
      - id: caddy
