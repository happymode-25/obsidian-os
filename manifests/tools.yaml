# Obsidian OS - Tool Integration Manifest
#
# Every security/dual-use tool the Security Center can install and launch.
#
# ---------------------------------------------------------------------------
# INTEGRITY POLICY (this file used to contain 16 fabricated URLs)
# ---------------------------------------------------------------------------
# Every `repo:` in this file was checked against the live host with
# `python3 scripts/verify-manifest-urls.py` on the date in `verified:`.
# Entries whose URL did not resolve are marked `status: unverified` and
# `build_graph: exclude`. They are KEPT rather than deleted, because a tool we
# wanted is a requirement we still have not met - deleting the line would make
# that invisible.
#
# A plausible-looking but unverified URL is worse than no URL: it turns a known
# gap into a supply-chain hazard, because something WILL eventually fetch it.
# Do not "fix" an unverified entry by guessing a repo name. Find the real
# project, verify it, then update both `repo:` and `status:`.
#
# Fields:
#   repo:          canonical upstream. Project site, not a guessed mirror.
#   install:       apt | pip | binary | deb | container | git | esptool
#   gui:           native | shell | web
#   status:        verified | unverified | archived | commercial
#   build_graph:   include | exclude  (exclude = never fetched by any build)
#   license:       only when it constrains redistribution
#   verified:      date the URL was last confirmed reachable
#
# Enforcement: the Security Center refuses to install any entry with
# `build_graph: exclude`, and refuses to install an entry whose status is
# `unverified` without an explicit per-tool authorization grant. Enabling a tool
# requires the Pentester profile (or server+redteam role) AND a recorded
# authorization consent in consent.json; see docs/LEGAL.md.
#
# `python3 scripts/validate-build.py --manifest` enforces the schema and the
# policy above. `python3 scripts/verify-manifest-urls.py` re-checks every URL
# against the live internet.
