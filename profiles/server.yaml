# Obsidian OS profile: server
# Posture: Hardened · Toolset: server stack · Session: headless (runit/s6 optional)

name: server
label: Server (Self-Host / Gateway)
flavor: server
posture: hardened
session: headless                # no desktop by default
# systemd, and only systemd. This field previously read
# `init: systemd  # set "runit" or "s6" for minimal footprint`. Alternative
# inits were part of the dropped multi-base design (ADR-0001); the single-base
# decision means there is no runit/s6 variant to select.
init: systemd
footprint: minimal

packages:
  - obsidian-server-server      # HOLLOW: installs a README and nothing else (Phase 2)
  - openssh-server
  - wireguard-tools
  - smartmontools
  - rsync
  - chrony

# One-click enable via serverctl / Server Hub. These are NOT installed at
# image build time: baking four internet-facing daemons into the base would
# ship a large network-listening attack surface before the user asked for it.
# They are installed on role enable. See manifests/tools.yaml server-stack.
roles:                          # one-click enable via serverctl / Server Hub
  web: caddy                    # auto-TLS
  database: postgresql
  containers: podman            # rootless
  nas: samba                    # + nfs-kernel-server
  reverse_proxy: caddy
  dns: bind9                    # a package, not the "coreDNS" container
  router: nftables              # gateway mode, opt-in, warns
  vm_host: libvirt

gui: server-hub                  # web dashboard (optional, on LAN only)
security:
  mandatory_access_control: apparmor-enforce
  firewall_egress: default
  firewall_ingress: whitelist    # open only explicitly enabled roles
  secure_boot: true
  disk_encryption: luks2
  ssh: key-only, no root login, passwordless sudo revoked
  unattended_upgrades: security-only
  telemetry: off

# ====== intended for =====================================================
# Homelab / small-server administrators who want a hardened, one-command
# web+db+nas+vm+router platform with a Windows-style management hub reachable
# from the LAN.