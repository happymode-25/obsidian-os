# Obsidian OS — CI/CD: validate, build, boot-test, release ISOs.
#
# WHAT CHANGED AND WHY (see docs/GAP-REPORT.md)
#   The previous workflow drove `debos/obsidian.yaml`, which could not build:
#     * it used the `debian-live` action, REMOVED from debos upstream;
#     * all four `run:` actions omitted `chroot: true`, so the profile/finalize
#       logic executed on the runner, not in the image;
#     * the `obs-repo-kernel` artifact was uploaded and never downloaded, so
#       the hardened kernel was silently dropped;
#     * the boot test ran with BOOTTEST_SOFT=1 and matched console strings that
#       a stock Debian live ISO also prints, so the gate was green on a broken
#       image.
#   CI never actually ran (the repo has no upstream and no CI run has ever
#   produced an ISO), which is how all of that stayed invisible.
#
#   The build is now `build/build-iso.sh` — a plain debootstrap -> packages ->
#   overlays -> mksquashfs -> grub-mkrescue pipeline with no container and no
#   framework quirks. `scripts/validate-build.py` fails the build on the whole
#   bug class above before a single package is fetched.
name: build-iso

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor(s) to build'
        type: choice
        options: [all, daily, developer, pentester, server, ghost]
        default: daily

env:
  SUITE: trixie
  ARCH: amd64

jobs:
  # ---- 0. static gates -----------------------------------------------------
  # validate-build.py is the important one: it checks pipeline SEMANTICS.
  # validate-phase0.py only checks that deliverables exist and parse, which is
  # why it reported GATE: PASS for a recipe that could never build.
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyyaml

      # The Ubuntu runners have a real kernel, so they have working F_OFD_SETLK
      # and the build NEVER compiles the WSL1 OFD-lock shim here. Nothing in a
      # real build would notice a shim that had rotted into non-compiling source.
      # validate-build.py compiles it and checks the exported symbols
      # specifically to close that hole, so this job needs a compiler --
      # `gcc` is preinstalled on ubuntu-24.04 and `nm` comes with it.
      - name: Build pipeline self-test (proves the gate can fail)
        run: python3 scripts/validate-build.py --self-test

      - name: Build pipeline semantic validation
        run: python3 scripts/validate-build.py --online

      - name: Phase 0 deliverable gate
        run: python3 scripts/validate-phase0.py

  # ---- 1. resolve the ISO build environment -------------------------------
  # Not cached on purpose: caching a debootstrap tree across runs is how you
  # ship last month's base with this month's overlays.
  build-iso:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: [daily, ghost]
    steps:
      - uses: actions/checkout@v4

      - name: Install build + boot-test dependencies
        run: |
          sudo apt-get update -qq
          # mmdebstrap, not debootstrap: debootstrap fetches every .deb with one
          # serial wget on GNU wget's default timeouts (--dns-timeout=900), so a
          # single stalled connection blocks the whole bootstrap for 15 minutes
          # and a fast link is wasted. Measured 20min -> 754s. debootstrap stays
          # available in the image as the documented fallback, but CI exercises
          # the primary path so the primary path is the one that is tested.
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring \
            squashfs-tools xorriso mtools dosfstools \
            grub2-common grub-pc-bin grub-efi-amd64-bin \
            systemd qemu-system-x86 qemu-utils

      - name: Build ISO (flavor=${{ matrix.flavor }})
        run: |
          sudo ./build/build-iso.sh \
            --flavor ${{ matrix.flavor }} \
            --suite "$SUITE" \
            --arch "$ARCH"
          mkdir -p output
          cp build/out/obsidian-${{ matrix.flavor }}-*.iso output/
          ls -la output/

      # This runs the REAL assertions. There is no soft mode: the test requires
      # OBSIDIAN-OS-MARKER, which only overlays/common/usr/local/sbin/
      # obsidian-boot-report can emit, and it fails if stock-Debian console
      # fingerprints appear at all.
      - name: QEMU boot test (strict)
        run: |
          ISO="$(ls output/obsidian-${{ matrix.flavor }}-*.iso | head -1)"
          echo "testing: $ISO"
          bash tests/boottest.sh "$ISO" \
            --flavor ${{ matrix.flavor }} \
            --timeout 600 \
            --keep-log

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-${{ matrix.flavor }}-iso
          path: output/obsidian-${{ matrix.flavor }}-*.iso
          retention-days: 60

  # ---- 2. release assembly (tags only) ------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-iso
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.iso > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release with ISOs + checksums
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          draft: true
          generate_release_notes: true
